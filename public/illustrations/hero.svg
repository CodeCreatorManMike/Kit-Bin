<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="binBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E9EDF6" />
    </linearGradient>
    <linearGradient id="binRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6EF0" />
      <stop offset="1" stop-color="#2646C9" />
    </linearGradient>
    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10182F" stop-opacity="0.14" />
      <stop offset="1" stop-color="#10182F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <ellipse cx="100" cy="184" rx="52" ry="8" fill="url(#groundShadow)" />

  <!-- pencil -->
  <g transform="rotate(-16 76 66)">
    <rect x="70" y="26" width="11" height="66" rx="2" fill="#F7B733" />
    <path d="M70 26 L75.5 13 L81 26 Z" fill="#8A5A22" />
    <rect x="70" y="88" width="11" height="9" fill="#8A5A22" />
  </g>

  <!-- small coral document, nods at PDF category -->
  <g transform="rotate(10 132 60)">
    <rect x="122" y="34" width="24" height="32" rx="3" fill="#F0554A" />
    <rect x="127" y="42" width="14" height="2.4" rx="1.2" fill="#FCD9D6" />
    <rect x="127" y="48" width="14" height="2.4" rx="1.2" fill="#FCD9D6" />
    <rect x="127" y="54" width="9" height="2.4" rx="1.2" fill="#FCD9D6" />
  </g>

  <!-- scissors -->
  <g transform="rotate(14 116 70)">
    <circle cx="104" cy="94" r="7.5" fill="none" stroke="#8C98AE" stroke-width="4.5" />
    <circle cx="123" cy="94" r="7.5" fill="none" stroke="#8C98AE" stroke-width="4.5" />
    <path d="M106 89 L134 42" stroke="#AAB4C6" stroke-width="5" stroke-linecap="round" />
    <path d="M121 89 L93 42" stroke="#AAB4C6" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- small mint tile, nods at Image category -->
  <g transform="rotate(-8 68 58)">
    <rect x="58" y="46" width="20" height="20" rx="4" fill="#22B27D" />
    <circle cx="64" cy="52.5" r="2.1" fill="#CFF3E5" />
    <path d="M60 63 L67 55 L72 60 L76 54" stroke="#CFF3E5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- bin -->
  <path d="M55 92 H145 L134 176 a10 10 0 0 1-10 9 H81 a10 10 0 0 1-10-9 Z" fill="url(#binBody)" stroke="#DDE3EF" stroke-width="1" />
  <g stroke="#D4DBE9" stroke-width="4" stroke-linecap="round">
    <path d="M85 112 v52" />
    <path d="M100 112 v52" />
    <path d="M115 112 v52" />
  </g>
  <rect x="48" y="82" width="104" height="14" rx="7" fill="url(#binRim)" />
  <rect x="86" y="66" width="28" height="14" rx="4" fill="url(#binRim)" />
</svg>
